<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L6 紙本題型練習｜單字練習室</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f2;color:#243f36;font:17px/1.7 system-ui,sans-serif}main{max-width:950px;margin:auto;padding:24px 18px 70px}a{color:#226954}h1{font-size:clamp(27px,5vw,40px);margin:16px 0 8px}h2{font-size:clamp(23px,4vw,30px);line-height:1.6}.panel{background:white;border:1px solid #dbe5dc;border-radius:20px;padding:clamp(18px,4vw,32px);margin:20px 0}button,select{font:inherit;border:1px solid #bccfc2;border-radius:12px;background:white;color:inherit;padding:12px 16px;cursor:pointer}button:disabled{cursor:default;opacity:.65}.primary{background:#226954;color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{text-align:left;min-height:62px}.correct{background:#e1f3e5;border:2px solid #2b7a46}.incorrect{background:#ffe9e4;border:2px solid #b44c36}.muted{color:#61776b;font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}label{display:block;margin-bottom:10px}select{width:100%}progress{width:100%;accent-color:#226954}#feedback{white-space:pre-wrap;margin:18px 0}table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:10px 5px;text-align:left;border-bottom:1px solid #dbe5dc}details{padding:14px 0;border-bottom:1px solid #dbe5dc}summary{cursor:pointer}.hidden{display:none!important}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #ce9e28;outline-offset:3px}@media(max-width:520px){.grid{grid-template-columns:1fr}.row button{flex:1}table{font-size:13px}}
</style><main><a href="./index.html">← 回單字練習室</a><p class="muted">LEVEL 6 / PAPER PRACTICE</p><h1>L6 紙本題型練習</h1><p>從認得單字，練到看懂句子。依你提供的第 101～150 題整理，一次專心完成一題。</p><section class="panel"><label for="kind">選擇測驗</label><select id="kind"><option value="all">整份測驗 · 50 題 · 100 分</option><option value="definition">二、單字解釋 · 10 題 · 20 分</option><option value="context">三、句意測驗 · 20 題 · 40 分</option><option value="synonym">四、同義字 · 10 題 · 20 分</option><option value="antonym">五、反義字 · 10 題 · 20 分</option></select><label style="margin-top:16px"><input type="checkbox" id="shuffle"> 隨機題序（不勾選則依原題號）</label><div class="row"><button id="start" class="primary">開始測驗</button><button id="review">錯題重練</button></div><p id="storage" class="muted">成績與錯題保存在這台裝置、這個瀏覽器。</p><p id="wrongCount" class="muted"></p></section><section id="work" class="panel hidden" aria-label="作答區"><p id="status" class="muted"></p><progress id="progress" value="0" max="50"></progress><h2 id="prompt"></h2><div id="choices" class="grid"></div><div id="feedback" role="status" aria-live="polite"></div><div class="row"><button id="skip">不會，顯示答案</button><button id="next" class="primary hidden">下一題 →</button></div></section><section id="result" class="panel hidden" aria-live="polite"></section><section class="panel"><h2>最近練習</h2><div id="history"></div><p class="muted">只計首次作答；錯題重練會另列，不混入整份測驗分數。題庫共 50 題；同義字與反義字請選最接近題意的選項。</p></section></main><script src="l6-paper-data.js?v=20261109"></script><script src="l6-paper.js?v=20261109"></script></html>
